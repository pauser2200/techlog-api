<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechLog · Pedidos</title>
  <style>
    :root { --tinta: #1c1433; --suave: #5d5578; --linha: #e2ddef; --roxo: #410994; --erro: #a4161a; --fundo: #f5f3fa; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: var(--tinta); background: var(--fundo); }
    main { max-width: 960px; margin: 0 auto; padding: 32px 16px; }
    h1 { margin: 0 0 4px; font-size: 26px; }
    .origem { color: var(--suave); font-size: 14px; margin: 0 0 24px; }
    table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--linha); }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--linha); }
    th { font-size: 13px; color: var(--suave); text-transform: uppercase; letter-spacing: .04em; }
    td.valor { font-variant-numeric: tabular-nums; }
    .selo { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; background: #ece6ff; color: var(--roxo); }
    .selo.cancelado { background: #fde8e8; color: var(--erro); }
    .erro { padding: 16px; border: 1px solid var(--erro); color: var(--erro); background: #fff5f5; border-radius: 8px; }
    button { font: inherit; font-size: 14px; padding: 4px 12px; border-radius: 6px; border: 1px solid var(--roxo); background: #fff; color: var(--roxo); cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    .aviso { margin: 0 0 16px; padding: 10px 14px; border-radius: 8px; background: #fff; border: 1px solid var(--linha); }
    .aviso:empty { display: none; }
    dialog { border: 1px solid var(--linha); border-radius: 10px; padding: 20px; max-width: 420px; width: calc(100% - 32px); color: var(--tinta); }
    dialog::backdrop { background: rgba(28, 20, 51, .35); }
    dialog h2 { margin: 0 0 12px; font-size: 18px; }
    dialog label { display: block; font-size: 14px; color: var(--suave); margin-bottom: 4px; }
    dialog textarea { width: 100%; font: inherit; padding: 8px; border: 1px solid var(--linha); border-radius: 6px; }
    dialog .acoes { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>Pedidos</h1>
    <p class="origem" id="origem"></p>
    <p id="aviso" class="aviso" role="status"></p>
    <div id="conteudo">Carregando...</div>
    <dialog id="confirmar-cancelamento">
      <form method="dialog">
        <h2 id="titulo-cancelamento"></h2>
        <label for="motivo-cancelamento">Motivo (opcional)</label>
        <textarea id="motivo-cancelamento" rows="3"></textarea>
        <div class="acoes">
          <button value="voltar">Voltar</button>
          <button value="confirmar" id="confirmar-cancelamento-botao">Cancelar pedido</button>
        </div>
      </form>
    </dialog>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
